# Free, deterministic checks only. The paid evals in evals/ are never run here: this workflow
# has no API keys or repository secrets, so nothing it does can be billed to a model provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.15.12
      # Lint only: the tree isn't ruff-formatted, so `ruff format --check` would fail on style alone.
      - run: ruff check .

  test:
    name: test (ubuntu, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor in pyproject.toml; 3.14 is the newest supported release.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # `--group` needs pip 25.1. Ruff and pylint are here so the tests comparing the stated
      # limits against those tools' defaults run instead of skipping; ruff stays pinned with lint.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev --group cases ruff==0.15.12 pylint
      # Calibration grades agent-written code inside macOS sandbox-exec and refuses to run it unconfined, so the macOS job runs it.
      - run: python -m pytest tests/ -q -rs -m "not sandbox"

  test-macos:
    name: test (macos, stock python)
    # Hosted macOS minutes count heavily against a private repository's free quota, so a private
    # repository runs this on request only. Going public turns it on with no edit here.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately not setup-python: the hooks run on the python3 macOS ships, so test that one.
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
      - run: echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev --group cases ruff==0.15.12 pylint
      - run: python -m pytest tests/ -q -rs
