[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True

[mypy-tidewater.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_explicit = True
warn_return_any = True

[mypy-tidewater.domain.adjustments.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_explicit = True
warn_return_any = True

[mypy-tidewater.domain.billing.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_explicit = True

[mypy-tidewater.domain.customs.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-tidewater.domain.settlement.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_explicit = True

[mypy-tidewater.services.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_explicit = True

[mypy-tidewater.domain.weather.*]
ignore_errors = True
