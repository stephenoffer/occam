[project]
name = "findoc"
version = "0.7.0"
description = "Command-line search for the company handbook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
findoc = "findoc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["findoc", "textproc", "corpus", "indexing", "query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
